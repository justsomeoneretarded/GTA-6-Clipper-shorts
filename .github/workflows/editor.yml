name: GTA VI editor engine

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      engine:
        type: string
        required: true
      catalog_ref:
        type: string
        required: false
      include_nov18:
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        required: false
      TAVILY_API_KEY:
        required: false
      YOUTUBE_API_KEY:
        required: false
      YOUTUBE_COOKIES:
        required: false
      TWITCH_CLIENT_ID:
        required: false
      TWITCH_CLIENT_SECRET:
        required: false
      CATALOG_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: gta6-editor-${{ github.repository }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      MODE: ${{ inputs.mode }}
      INCLUDE_NOV18: ${{ inputs.include_nov18 && 'true' || 'false' }}
      PROJECT_DIR: ${{ github.workspace }}/project
      ENGINE_DIR: ${{ github.workspace }}/engine
      STATE_DIR: ${{ github.workspace }}/state
      WORK_DIR: ${{ github.workspace }}/work
      OUTPUT_DIR: ${{ github.workspace }}/dist
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_SEARCH_ENABLED: ${{ vars.GEMINI_SEARCH_ENABLED }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      SCOUT_WINDOWS: ${{ vars.SCOUT_WINDOWS }}
      AUDITION_MOMENTS: ${{ vars.AUDITION_MOMENTS }}
      MIN_MOMENT_SCORE: ${{ vars.MIN_MOMENT_SCORE }}
    steps:
      - name: Validate the Gemini secret
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            mkdir -p "$OUTPUT_DIR"
            printf '# Configuration required\n\nAdd GEMINI_API_KEY under Settings → Secrets and variables → Actions.\n' \
              > "$OUTPUT_DIR/configuration.md"
            echo '::error::GEMINI_API_KEY is missing from this repository.'
            exit 1
          fi

      - name: Check out the editor repository
        uses: actions/checkout@v7
        with:
          path: project

      - name: Check out the shared engine
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.engine }}
          ref: main
          path: engine
          persist-credentials: false
          token: ${{ secrets.CATALOG_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Set up yt-dlp's JavaScript runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install media tools
        run: |
          bash "$ENGINE_DIR/scripts/setup-media.sh"
          python -m pip install -r "$ENGINE_DIR/requirements.txt"

      - name: Load this editor's state
        run: bash "$ENGINE_DIR/scripts/state.sh" load "$PROJECT_DIR" "$STATE_DIR"

      - name: Load the shared catalog
        if: inputs.mode != 'shorts'
        env:
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN || github.token }}
          CATALOG_REPOSITORY: ${{ inputs.engine }}
          CATALOG_REF: ${{ inputs.catalog_ref || 'clipper-state' }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          if [[ "$CATALOG_REF" != clipper-state && ! "$CATALOG_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected a full catalog commit SHA.'
            exit 1
          fi
          if ! gh api "repos/$CATALOG_REPOSITORY/contents/catalog.json?ref=$CATALOG_REF" \
            -H 'Accept: application/vnd.github.raw+json' > "$STATE_DIR/shared-catalog.json"; then
            rm -f "$STATE_DIR/shared-catalog.json"
            printf '# Shared catalog unavailable\n\nThis editor will search for footage directly.\n' \
              > "$OUTPUT_DIR/catalog-report.md"
          fi
          if ! gh api "repos/$CATALOG_REPOSITORY/contents/ledger.json?ref=clipper-state" \
            -H 'Accept: application/vnd.github.raw+json' > "$STATE_DIR/shared-ledger.json"; then
            rm -f "$STATE_DIR/shared-ledger.json"
          fi

      - name: Discover footage and audition cuts
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        working-directory: engine
        run: python -m clipper discover --mode "$MODE" --state "$STATE_DIR" --work "$WORK_DIR" --output "$OUTPUT_DIR"

      - name: Save this editor's timestamp catalog
        run: bash "$ENGINE_DIR/scripts/state.sh" save-catalog "$PROJECT_DIR" "$STATE_DIR"

      - name: Restore the caption model
        id: caption-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/whisper/hub/models--Systran--faster-whisper-small
          key: whisper-small-536b0662742c02347bc0e980a01041f333bce120

      - name: Render and review the videos
        env:
          HF_HOME: ${{ runner.temp }}/whisper
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        working-directory: engine
        run: |
          python -m clipper render --mode "$MODE" --state "$STATE_DIR" --work "$WORK_DIR" --output "$OUTPUT_DIR"

      - name: Check that the caption model is complete
        id: caption-model
        if: steps.caption-cache.outputs.cache-hit != 'true'
        env:
          MODEL_FILES: ${{ runner.temp }}/whisper/hub/models--Systran--faster-whisper-small/snapshots/536b0662742c02347bc0e980a01041f333bce120
        run: |
          if [[ -s "$MODEL_FILES/model.bin" && -s "$MODEL_FILES/tokenizer.json" &&
                -s "$MODEL_FILES/config.json" && -s "$MODEL_FILES/vocabulary.txt" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the complete caption model
        if: steps.caption-model.outputs.ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/whisper/hub/models--Systran--faster-whisper-small
          key: whisper-small-536b0662742c02347bc0e980a01041f333bce120

      - name: Package videos and upload notes
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gta6-${{ inputs.mode }}-${{ github.run_id }}
          path: dist/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      - name: Remember packaged cuts and editorial rejections
        run: bash "$ENGINE_DIR/scripts/state.sh" save-ledger "$PROJECT_DIR" "$STATE_DIR"
