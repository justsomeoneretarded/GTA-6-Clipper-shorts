name: GTA VI editor engine

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      engine:
        type: string
        required: true
    secrets:
      GEMINI_API_KEY:
        required: false
      TAVILY_API_KEY:
        required: false
      YOUTUBE_API_KEY:
        required: false
      TWITCH_CLIENT_ID:
        required: false
      TWITCH_CLIENT_SECRET:
        required: false
      CATALOG_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: gta6-editor-${{ github.repository }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      MODE: ${{ inputs.mode }}
      PROJECT_DIR: ${{ github.workspace }}/project
      ENGINE_DIR: ${{ github.workspace }}/engine
      STATE_DIR: ${{ github.workspace }}/state
      WORK_DIR: ${{ github.workspace }}/work
      OUTPUT_DIR: ${{ github.workspace }}/dist
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_SEARCH_ENABLED: ${{ vars.GEMINI_SEARCH_ENABLED }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      SCOUT_WINDOWS: ${{ vars.SCOUT_WINDOWS }}
      AUDITION_MOMENTS: ${{ vars.AUDITION_MOMENTS }}
      MIN_MOMENT_SCORE: ${{ vars.MIN_MOMENT_SCORE }}
    steps:
      - name: Validate the Gemini secret
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            mkdir -p "$OUTPUT_DIR"
            printf '# Configuration required\n\nAdd GEMINI_API_KEY under Settings → Secrets and variables → Actions.\n' \
              > "$OUTPUT_DIR/configuration.md"
            echo '::error::GEMINI_API_KEY is missing from this repository.'
            exit 1
          fi

      - name: Check out the editor repository
        uses: actions/checkout@v7
        with:
          path: project

      - name: Check out the shared engine
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.engine }}
          ref: main
          path: engine
          persist-credentials: false
          token: ${{ secrets.CATALOG_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Set up yt-dlp's JavaScript runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install media tools
        run: |
          bash "$ENGINE_DIR/scripts/setup-media.sh"
          python -m pip install -r "$ENGINE_DIR/requirements.txt"

      - name: Load this editor's state
        run: bash "$ENGINE_DIR/scripts/state.sh" load "$PROJECT_DIR" "$STATE_DIR"

      - name: Load the shared catalog
        if: inputs.mode != 'shorts'
        env:
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN || github.token }}
          CATALOG_REPOSITORY: ${{ inputs.engine }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          if ! gh api "repos/$CATALOG_REPOSITORY/contents/catalog.json?ref=clipper-state" \
            -H 'Accept: application/vnd.github.raw+json' > "$STATE_DIR/catalog.json"; then
            printf '# Catalog unavailable\n\nRun discovery in the Shorts repository to publish the first catalog.\n' \
              > "$OUTPUT_DIR/catalog-report.md"
            exit 1
          fi

      - name: Discover footage and audition cuts
        if: inputs.mode == 'shorts'
        working-directory: engine
        run: python -m clipper discover --state "$STATE_DIR" --work "$WORK_DIR" --output "$OUTPUT_DIR"

      - name: Publish the timestamp catalog
        if: inputs.mode == 'shorts'
        run: bash "$ENGINE_DIR/scripts/state.sh" save-catalog "$PROJECT_DIR" "$STATE_DIR"

      - name: Render and review the videos
        env:
          HF_HOME: ${{ runner.temp }}/whisper
        working-directory: engine
        run: |
          python -m clipper render --mode "$MODE" --state "$STATE_DIR" --work "$WORK_DIR" --output "$OUTPUT_DIR"

      - name: Package videos and upload notes
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gta6-${{ inputs.mode }}-${{ github.run_id }}
          path: dist/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      - name: Remember successfully packaged cuts
        run: bash "$ENGINE_DIR/scripts/state.sh" save-ledger "$PROJECT_DIR" "$STATE_DIR"
