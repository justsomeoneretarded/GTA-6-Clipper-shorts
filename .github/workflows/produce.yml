name: Produce GTA VI Shorts
run-name: ${{ inputs.include_nov18 && 'GTA VI Shorts including November 18' || 'Produce GTA VI Shorts' }}

on:
  workflow_dispatch:
    inputs:
      include_nov18:
        description: Include footage published November 18 Nairobi time in this batch
        type: boolean
        default: false
  schedule:
    - cron: '23 5,17 * * *'

permissions:
  contents: write

jobs:
  produce:
    uses: ./.github/workflows/editor.yml
    with:
      mode: shorts
      engine: ${{ github.repository }}
      include_nov18: ${{ inputs.include_nov18 == true }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES || secrets.YT_COOKIES || secrets.YOUTUBE_COOKIES_TXT || secrets.YOUTUBE_COOKIES_B64 }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
